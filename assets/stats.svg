<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="110" viewBox="0 0 900 110" role="img" aria-label="Profile numbers"><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.in{opacity:0;animation:in .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes grow{from{transform:scaleX(0)}}
</style><rect x=".5" y=".5" width="899" height="109" rx="12" fill="#0d1117" stroke="#30363d"/><g class="in" style="animation-delay:0.20s"><text x="40" y="46" font-size="12" fill="#8b949e">Repositories</text><text x="40" y="82" font-size="32" font-weight="700" fill="#e6edf3">5</text></g><line x1="225" y1="26" x2="225" y2="84" stroke="#30363d"/><g class="in" style="animation-delay:0.32s"><text x="245" y="46" font-size="12" fill="#8b949e">Stars</text><text x="245" y="82" font-size="32" font-weight="700" fill="#e6edf3">0</text></g><line x1="430" y1="26" x2="430" y2="84" stroke="#30363d"/><g class="in" style="animation-delay:0.44s"><text x="450" y="46" font-size="12" fill="#8b949e">Followers</text><text x="450" y="82" font-size="32" font-weight="700" fill="#e6edf3">1</text></g><line x1="635" y1="26" x2="635" y2="84" stroke="#30363d"/><g class="in" style="animation-delay:0.56s"><text x="655" y="46" font-size="12" fill="#8b949e">Contributions, last year</text><text x="655" y="82" font-size="32" font-weight="700" fill="#e6edf3">193</text></g></svg>