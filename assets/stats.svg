<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Profile stats"><style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.sans{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.fu{opacity:0;animation:fu .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.b1{animation:d1 11s ease-in-out infinite alternate}
.b2{animation:d2 13s ease-in-out infinite alternate}
.b3{animation:d3 9s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(140px,30px)}}
@keyframes d2{to{transform:translate(-160px,-22px)}}
@keyframes d3{to{transform:translate(-60px,-40px)}}
.bl{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pulse{animation:pu 2.2s ease-in-out infinite}
@keyframes pu{50%{opacity:.3}}
.bar{transform-box:fill-box;transform-origin:left center;animation:bar 1.6s cubic-bezier(.2,.8,.2,1) backwards}@keyframes bar{from{transform:scaleX(0)}}.draw{stroke-dasharray:600;animation:draw 1.6s ease-out forwards}@keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}</style><defs>
<linearGradient id="bgt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04120c"/><stop offset="1" stop-color="#060a14"/></linearGradient>
<linearGradient id="bdt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22e58a" stop-opacity=".85"/><stop offset=".55" stop-color="#22e58a" stop-opacity=".14"/><stop offset="1" stop-color="#7c5cff" stop-opacity=".65"/></linearGradient>
<filter id="blt" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="36"/></filter>
<clipPath id="clt"><rect width="900" height="210" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clt)">
<rect width="900" height="210" fill="url(#bgt)"/>
<ellipse class="b1" cx="162" cy="-6" rx="250" ry="80" fill="#14c466" opacity=".55" filter="url(#blt)"/>
<ellipse class="b2" cx="594" cy="218" rx="250" ry="62" fill="#a3b800" opacity=".32" filter="url(#blt)"/>
<ellipse class="b3" cx="900" cy="178" rx="130" ry="80" fill="#4b2bff" opacity=".35" filter="url(#blt)"/>
</g>
<rect x=".75" y=".75" width="898.5" height="208.5" rx="23.5" fill="none" stroke="url(#bdt)" stroke-width="1.5"/><text class="sans" x="40" y="56" font-size="26" font-weight="800" fill="#4ade80">Profile Signal</text><text class="mono" x="40" y="78" font-size="11" fill="#64748b">live GitHub stats, refreshed daily</text><g class="fu" style="animation-delay:0.00s"><g transform="translate(40,96)"><rect class="draw" width="190" height="92" rx="16" fill="#020b07" fill-opacity=".7" stroke="#22e58a" stroke-opacity=".7" style="animation-delay:0.0s"/><text class="mono" x="20" y="28" font-size="11" font-weight="700" letter-spacing="2" fill="#22e58a">STARS</text><text class="sans" x="20" y="64" font-size="34" font-weight="800" fill="#22e58a">0</text><rect x="20" y="76" width="150" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/><rect class="bar" x="20" y="76" width="9" height="6" rx="3" fill="#22e58a" style="animation-delay:0.5s"/></g></g><g class="fu" style="animation-delay:0.15s"><g transform="translate(250,96)"><rect class="draw" width="190" height="92" rx="16" fill="#020b07" fill-opacity=".7" stroke="#7c5cff" stroke-opacity=".7" style="animation-delay:0.15s"/><text class="mono" x="20" y="28" font-size="11" font-weight="700" letter-spacing="2" fill="#7c5cff">CONTRIBUTIONS</text><text class="sans" x="20" y="64" font-size="34" font-weight="800" fill="#7c5cff">164</text><rect x="20" y="76" width="150" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/><rect class="bar" x="20" y="76" width="49" height="6" rx="3" fill="#7c5cff" style="animation-delay:0.65s"/></g></g><g class="fu" style="animation-delay:0.30s"><g transform="translate(460,96)"><rect class="draw" width="190" height="92" rx="16" fill="#020b07" fill-opacity=".7" stroke="#c6f432" stroke-opacity=".7" style="animation-delay:0.3s"/><text class="mono" x="20" y="28" font-size="11" font-weight="700" letter-spacing="2" fill="#c6f432">REPOS</text><text class="sans" x="20" y="64" font-size="34" font-weight="800" fill="#c6f432">5</text><rect x="20" y="76" width="150" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/><rect class="bar" x="20" y="76" width="38" height="6" rx="3" fill="#c6f432" style="animation-delay:0.8s"/></g></g><g class="fu" style="animation-delay:0.45s"><g transform="translate(670,96)"><rect class="draw" width="190" height="92" rx="16" fill="#020b07" fill-opacity=".7" stroke="#2dd4bf" stroke-opacity=".7" style="animation-delay:0.44999999999999996s"/><text class="mono" x="20" y="28" font-size="11" font-weight="700" letter-spacing="2" fill="#2dd4bf">FOLLOWERS</text><text class="sans" x="20" y="64" font-size="34" font-weight="800" fill="#2dd4bf">1</text><rect x="20" y="76" width="150" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/><rect class="bar" x="20" y="76" width="9" height="6" rx="3" fill="#2dd4bf" style="animation-delay:0.95s"/></g></g></svg>