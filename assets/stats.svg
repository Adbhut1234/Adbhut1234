<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Profile stats"><style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.sans{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.fu{opacity:0;animation:fu .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.b1{animation:d1 11s ease-in-out infinite alternate}
.b2{animation:d2 13s ease-in-out infinite alternate}
.b3{animation:d3 9s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(140px,30px)}}
@keyframes d2{to{transform:translate(-160px,-22px)}}
@keyframes d3{to{transform:translate(-60px,-40px)}}
.bl{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pulse{animation:pu 2.2s ease-in-out infinite}
@keyframes pu{50%{opacity:.3}}
.bar{transform-box:fill-box;transform-origin:left center;animation:bar 1.6s cubic-bezier(.2,.8,.2,1) backwards}@keyframes bar{from{transform:scaleX(0)}}.draw{stroke-dasharray:600;animation:draw 1.6s ease-out forwards}@keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}</style><defs>
<linearGradient id="bgt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12060a"/><stop offset="1" stop-color="#0a0608"/></linearGradient>
<linearGradient id="bdt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b47" stop-opacity=".85"/><stop offset=".55" stop-color="#ff3b47" stop-opacity=".14"/><stop offset="1" stop-color="#b4121f" stop-opacity=".65"/></linearGradient>
<filter id="blt" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="36"/></filter>
<clipPath id="clt"><rect width="900" height="210" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clt)">
<rect width="900" height="210" fill="url(#bgt)"/>
<ellipse class="b1" cx="162" cy="-6" rx="250" ry="80" fill="#d4121f" opacity=".55" filter="url(#blt)"/>
<ellipse class="b2" cx="594" cy="218" rx="250" ry="62" fill="#e8641a" opacity=".32" filter="url(#blt)"/>
<ellipse class="b3" cx="900" cy="178" rx="130" ry="80" fill="#7a0e1a" opacity=".35" filter="url(#blt)"/>
</g>
<rect x=".75" y=".75" width="898.5" height="208.5" rx="23.5" fill="none" stroke="url(#bdt)" stroke-width="1.5"/><text class="sans" x="40" y="56" font-size="26" font-weight="800" fill="#ff6b75">Profile Signal</text><text class="mono" x="40" y="78" font-size="11" fill="#64748b">live GitHub stats, refreshed daily</text><g class="fu" style="animation-delay:0.00s"><g transform="translate(40,96)"><rect class="draw" width="190" height="92" rx="16" fill="#0b0305" fill-opacity=".7" stroke="#ff3b47" stroke-opacity=".7" style="animation-delay:0.0s"/><text class="mono" x="20" y="28" font-size="11" font-weight="700" letter-spacing="2" fill="#ff3b47">STARS</text><text class="sans" x="20" y="64" font-size="34" font-weight="800" fill="#ff3b47">0</text><rect x="20" y="76" width="150" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/><rect class="bar" x="20" y="76" width="9" height="6" rx="3" fill="#ff3b47" style="animation-delay:0.5s"/></g></g><g class="fu" style="animation-delay:0.15s"><g transform="translate(250,96)"><rect class="draw" width="190" height="92" rx="16" fill="#0b0305" fill-opacity=".7" stroke="#b4121f" stroke-opacity=".7" style="animation-delay:0.15s"/><text class="mono" x="20" y="28" font-size="11" font-weight="700" letter-spacing="2" fill="#b4121f">CONTRIBUTIONS</text><text class="sans" x="20" y="64" font-size="34" font-weight="800" fill="#b4121f">165</text><rect x="20" y="76" width="150" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/><rect class="bar" x="20" y="76" width="50" height="6" rx="3" fill="#b4121f" style="animation-delay:0.65s"/></g></g><g class="fu" style="animation-delay:0.30s"><g transform="translate(460,96)"><rect class="draw" width="190" height="92" rx="16" fill="#0b0305" fill-opacity=".7" stroke="#ffd166" stroke-opacity=".7" style="animation-delay:0.3s"/><text class="mono" x="20" y="28" font-size="11" font-weight="700" letter-spacing="2" fill="#ffd166">REPOS</text><text class="sans" x="20" y="64" font-size="34" font-weight="800" fill="#ffd166">5</text><rect x="20" y="76" width="150" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/><rect class="bar" x="20" y="76" width="38" height="6" rx="3" fill="#ffd166" style="animation-delay:0.8s"/></g></g><g class="fu" style="animation-delay:0.45s"><g transform="translate(670,96)"><rect class="draw" width="190" height="92" rx="16" fill="#0b0305" fill-opacity=".7" stroke="#ff8a4c" stroke-opacity=".7" style="animation-delay:0.44999999999999996s"/><text class="mono" x="20" y="28" font-size="11" font-weight="700" letter-spacing="2" fill="#ff8a4c">FOLLOWERS</text><text class="sans" x="20" y="64" font-size="34" font-weight="800" fill="#ff8a4c">1</text><rect x="20" y="76" width="150" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/><rect class="bar" x="20" y="76" width="9" height="6" rx="3" fill="#ff8a4c" style="animation-delay:0.95s"/></g></g></svg>