<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Footer"><style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.sans{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.fu{opacity:0;animation:fu .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.b1{animation:d1 11s ease-in-out infinite alternate}
.b2{animation:d2 13s ease-in-out infinite alternate}
.b3{animation:d3 9s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(140px,30px)}}
@keyframes d2{to{transform:translate(-160px,-22px)}}
@keyframes d3{to{transform:translate(-60px,-40px)}}
.bl{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pulse{animation:pu 2.2s ease-in-out infinite}
@keyframes pu{50%{opacity:.3}}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-900px)}}</style><defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9b1021"/><stop offset=".5" stop-color="#ff8a4c"/><stop offset="1" stop-color="#7a0e1a"/></linearGradient></defs><g class="fu" style="animation-delay:0.20s"><text class="sans" x="450" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#f0262f">Let’s build something great together</text><text class="mono" x="450" y="76" text-anchor="middle" font-size="11" letter-spacing="3" fill="#64748b">OPEN TO COLLABS &amp; HACKATHON TEAMS</text></g><path d="M0 104 Q225 82 450 104 T900 104 T1350 104 T1800 104 V150 H0 Z" fill="url(#wg)" fill-opacity="0.35" style="animation:wv 14s linear infinite;animation-delay:0s"/><path d="M0 116 Q225 98 450 116 T900 116 T1350 116 T1800 116 V150 H0 Z" fill="url(#wg)" fill-opacity="0.5" style="animation:wv 10s linear infinite;animation-delay:-3s"/><path d="M0 130 Q225 116 450 130 T900 130 T1350 130 T1800 130 V150 H0 Z" fill="url(#wg)" fill-opacity="0.8" style="animation:wv 7s linear infinite;animation-delay:-1s"/></svg>