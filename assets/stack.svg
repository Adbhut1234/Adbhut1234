<filter id="bls" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="36"/></filter>
<clipPath id="cls"><rect width="900" height="200" rx="24"/></clipPath>
</defs>
<g clip-path="url(#cls)">
<rect width="900" height="200" fill="url(#bgs)"/>
